<!doctype html>
<!--
  Source of the profile billboard. render.mjs opens this page, injects the IBM Plex
  fonts from pocketcontext-website/public/fonts and screenshots each [data-shot]
  element once per theme in data-themes. Palette from pocketcontext-website.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PocketContext profile images</title>
<style>
:root{--ink:#0d1712;--ink2:#16241d;--lime:#c8f169;--cream:#f5f3ed;--paper:#f5f3ed;--pale:#ecefe3;--sage:#688258;--dim:#9db0a3;--intro:#c6d3c8;--line:#d7dcd1;--green:#2e493e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Plex,Arial,sans-serif;background:#888;padding:40px;font-synthesis:none}
.shot{--bg:var(--ink);--panel:var(--ink2);--fg:var(--cream);--muted:var(--intro);--soft:var(--dim);--rule:#ffffff1f;--card:var(--ink);--hl-fg:var(--lime);--hl-bg:transparent;--tag:var(--lime);--dots:#ffffff14;--glow:#c8f16930;--mark-fill:var(--ink)}
body.light .shot{--bg:var(--paper);--panel:#ffffff;--fg:var(--ink);--muted:#4d5f55;--soft:#657168;--rule:var(--line);--card:var(--pale);--hl-fg:var(--ink);--hl-bg:var(--lime);--tag:var(--sage);--dots:#0d171212;--glow:#c8f16955;--mark-fill:var(--ink)}
.shot{position:relative;overflow:hidden;background:var(--bg);color:var(--fg);width:1600px;height:800px}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--dots) 1.4px,transparent 1.4px);background-size:32px 32px}
.glow{position:absolute;top:-300px;right:-200px;width:900px;height:900px;background:radial-gradient(circle,var(--glow),transparent 66%)}
.in{position:relative;z-index:1;display:grid;grid-template-columns:1fr 470px;gap:56px;align-items:center;height:100%;padding:0 96px}
.brand{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700;letter-spacing:-.02em}
.brand svg{width:58px;height:58px}
h1{margin:52px 0 36px;font-size:92px;line-height:1.06;letter-spacing:-.05em;font-weight:700}
.hl{color:var(--hl-fg);background:var(--hl-bg);border-radius:10px;padding:0 .08em;margin-left:-.08em}
p{font-size:30px;line-height:1.4;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:22px;padding:22px 24px}
.card .k{font:400 14px/1 Mono,monospace;letter-spacing:1.8px;text-transform:uppercase;color:var(--sage);margin-bottom:14px}
.card .prompt{font:400 19px/1.45 Mono,monospace;color:var(--fg)}
.card .prompt b{color:var(--hl-fg);background:var(--hl-bg);font-weight:400;padding:0 .15em;border-radius:4px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts span{font:400 16px/1 Mono,monospace;color:var(--soft);border:1px solid var(--rule);border-radius:999px;padding:10px 13px;background:var(--card)}
.card.bin{border-color:#c8f169aa;box-shadow:inset 4px 0 0 var(--lime)}
.arrow{align-self:center;color:var(--lime);width:30px;height:30px}
body.light .arrow{color:var(--green)}
.apps{display:flex;gap:10px}
.apps span{flex:1;text-align:center;font-size:21px;font-weight:700;letter-spacing:-.02em;border-radius:16px;padding:18px 10px;background:var(--card);border:1px solid var(--rule)}
.apps span.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
</style>
</head>
<body>
<section class="shot" data-shot="hero" data-themes="dark light">
  <div class="dots"></div><div class="glow"></div>
  <div class="in">
    <div>
      <div class="brand"><svg viewBox="0 0 256 256"><path d="M15 10h226v149l-113 87L15 159z" fill="var(--mark-fill)" stroke="#c8f169" stroke-width="12" stroke-linejoin="round"/><path d="m86 124 30 30 64-70" fill="none" stroke="#c8f169" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg>PocketContext</div>
      <h1>Stop renting software.<br><span class="hl">Prompt your own.</span></h1>
      <p>One prompt. One binary. Everything already decided.</p>
    </div>
    <div class="stack" aria-hidden="true">
      <div class="card"><div class="k">One prompt</div><div class="prompt">Make me an app for <b>my data model</b>.</div></div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
      <div class="card bin"><div class="k">One binary</div><div class="parts"><span>web app</span><span>agent skill</span><span>server</span><span>database</span><span>tunnel</span><span>HTTPS</span></div></div>
      <div class="apps"><span class="on">Crew</span><span>Atlas</span><span>Yours</span></div>
    </div>
  </div>
</section>
</body>
</html>
